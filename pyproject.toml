[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "provdir"
version = "0.1.0"
description = "CMS-9115-F provider directory connection & data-quality evaluation service"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "prov-dir-eval" }]

dependencies = [
    "httpx>=0.27",
    "tenacity>=8.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "plotly>=5.22",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Heavier / situational extras. fhir.resources gives optional structural
# validation; kaleido enables static (PNG/SVG) export of Plotly figures.
fhir = ["fhir.resources>=7.1"]
viz-static = ["kaleido>=0.2.1"]
# Added in Phase 8 (network adequacy).
geo = ["geopy>=2.4", "censusgeocode>=0.5"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
provdir = "provdir.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
