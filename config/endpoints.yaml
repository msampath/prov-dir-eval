  # ----- HealthSparq/Kyruus public-token cluster (2026-07-07) --------------
  # Path recovered from the Swagger via /browse: a CENTRAL gateway
  # (api-gateway.healthsparq.com/provider-fhir-service/v1/fhir) serves all
  # tenants; a per-tenant PUBLIC token (no creds) from <tenant>fhir.healthsparq.com
  # selects the tenant. Codes are public (in the manifest, not .env). CDPHP flow
  # verified end-to-end: Org 61,728 / Pract 40,337 / roles 95,835.
  - key: cdphp
    payer_name: CDPHP (Capital District Physicians' Health Plan)
    parent_org: CDPHP
    brands: [CDPHP]
    base_url: https://api-gateway.healthsparq.com/provider-fhir-service/v1/fhir
    status: known
    mvp: false
    auth:
      strategy: healthsparq_public_token
      token_url: https://cdphpfhir.healthsparq.com/api/healthsparq-public-login-service/v1/token
      params: {insurer_code: CDPHP_I, brand_code: CDPHP, product_code: CDPHP}
    quirks:
      # HealthSparq caps page size at 100 and emits RELATIVE next links
      # (/v1/fhir/...?_getpagesoffset=N) — rewrite to absolute so paging advances.
      next_link_replace: ["/v1/fhir/", "https://api-gateway.healthsparq.com/provider-fhir-service/v1/fhir/"]

