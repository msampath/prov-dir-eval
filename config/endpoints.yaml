# ---------------------------------------------------------------------------
# Runtime endpoint manifest for prov-dir-eval.
#
# This is the AUTHORITATIVE runtime source (config.py loads it). It is curated
# from `provider_directory_endpoints.csv` (the human inventory tracker) plus the
# confirmed endpoint table in PROJECT_STATUS.md, and adds runtime-only fields
# the CSV does not carry: auth strategy, the .env secret keys each endpoint
# needs, known server quirks, and pagination limits.
#
# One entry per DISTINCT base URL. `brands` lists every payer the URL serves.
#
# auth.strategy values map to provdir.auth strategies:
#   none | client_id_header | client_id_secret_headers | api_key_header
#   | oauth2_client_credentials | healthsparq_public_token
#
# `mvp: true` marks the 7 fully-open endpoints used for the credential-free
# MVP vertical slice.
#
# `resource_subset`: omit (or null) => all 8 Plan-Net resources expected.
# ---------------------------------------------------------------------------

meta:
  ig_version: "1.2.0"
  fhir_version: "4.0.1"
  plannet_resources:
    - Organization
    - Practitioner
    - PractitionerRole
    - Location
    - HealthcareService
    - OrganizationAffiliation
    - InsurancePlan
    - Endpoint

endpoints:
  # ----- Fully-open MVP subset (no credentials) ----------------------------
  - key: humana
    payer_name: Humana
    parent_org: Humana
    brands: [Humana]
    base_url: https://fhir.humana.com/api
    status: known
    mvp: true
    auth:
      strategy: none
    fhir_version: "4.0.1"
    ig_version: "1.1.0"
    quirks:
      # Humana's edge is Akamai-fronted and rate-blocks high request volume
      # (2026-07-08: a concurrency-10 id_chain tripped an IP-wide 403; see
      # docs/evidence/humana_akamai_rate_block.md). Throttle all Humana traffic.
      max_concurrency: 2
      min_request_interval: 0.5
      # Bare search caps at 500k/resource (per-search pagination ceiling), but
      # filtered searches each page fully. Partition past the cap. Honored params:
      # Practitioner=family, Organization=name, Location=address-state.
      # PractitionerRole: reverse-reference id_chain on the practitioner ids we
      # already hold. Probe 2026-07-08: PractitionerRole?practitioner=<id> pages
      # fully and _summary=count works per id (sample prac -> 16 roles, 1 page);
      # sidesteps the bare 500k cap and the un-partitionable specialty/calendar
      # sweep. Coverage bounded by loaded practitioners (a measured residual:
      # roles of practitioners we never landed are unreachable).
      # Practitioner: daterange sweep (closed-key => no a-z0-9 charset residual).
      # Probe 2026-07-06 (docs/evidence/humana_lastupdated_probe.md): counts work
      # at <=1y widths and the 2026 mass is spread (max cluster ~320k < 500k cap);
      # wide-window counts time out -> blind bisection handles them. Start 2020:
      # year counts show effectively all records are 2024+.
      # PractitionerRole: _summary=count times out at EVERY width (even 1 day) ->
      # daterange not viable; needs a count-free calendar-window mode (pending).
      # start 2024-01-01: probe 2026-07-06 showed 2024+2025+2026 counts already
      # sum to ~961k > the 853k bare total, so pre-2024 is effectively empty and
      # only costs 60s count-timeouts to blind-drill. 2024+ == the current active
      # directory (scope: active/current, not historical archive).
      adaptive:
        Practitioner: {param: _lastUpdated, mode: daterange, start: "2024-01-01", bucket_max: 100000}
        Organization: {param: name, mode: prefix, bucket_max: 100000}
        Location: {param: address-state, mode: values, bucket_max: 100000}
        # OR-batch practitioner ids (comma = OR, VERIFIED 2026-07-08: practitioner=
        # id1,id2 -> total 32). Humana caps page size at ~100 regardless of _count,
        # and a wide OR + big _count 502s the (flaky) origin: batch 100/_count 1000
        # 502'd every try; batch 50/_count 100 returns 200. So keep queries light:
        # batch 50, _count 100, concurrency 2 (throttled above). Transient 502s are
        # retried by the client; re-run to backfill any batches that exhaust retries.
        PractitionerRole: {mode: id_chain, chain_param: practitioner, source_table: practitioner, chain_batch: 50, chain_count: 100, chain_concurrency: 2}

  - key: capital_blue
    payer_name: Capital Blue Cross
    parent_org: Capital Blue Cross
    brands: [Capital Blue Cross]
    base_url: https://providerdirectory-api.capbluecross.com/r4
    status: known
    mvp: true
    auth:
      strategy: none
    quirks:
      # Filter-only server: bare search is rejected, and PractitionerRole/
      # OrganizationAffiliation have no name/state to partition by. A wide
      # `_lastUpdated=ge2000` filter both satisfies the "valid search parameter"
      # requirement AND matches every record; pagination works (unlike Premera),
      # so a single match-all filter + normal paging retrieves the full set
      # (PractitionerRole total ~2.2M). (values-mode with one value = match-all.)
      # daterange (probe 2026-07-07): a single match-all _lastUpdated filter
      # paginates but the server caps that one search — roles dead-ended at 1.61M
      # of 2.24M (72%), OrgAff at 31k of 562k (5.6%). Timestamps are well-spread
      # (2024/2025/2026 windows differ, sub-bisect cleanly), so time-bisection
      # gives each window its own pagination and recovers past the per-search cap.
      # Window-sum is the honest coverage denominator (bare count is rejected here).
      # start 2000: CB counts work at every width (empty old windows count 0 and
      # prune fast), so no reason to risk missing pre-2015 records + undercounting
      # the window-sum denominator.
      adaptive:
        PractitionerRole: {param: _lastUpdated, mode: daterange, bucket_max: 100000}
        # bucket_max 20k: at 100k, orgaff windows exceeded the server's per-search
        # pagination cap and capped at 78%; smaller windows page fully.
        OrganizationAffiliation: {param: _lastUpdated, mode: daterange, bucket_max: 20000}

  - key: excellus
    payer_name: Excellus BlueCross BlueShield
    parent_org: Excellus
    brands: [Excellus BCBS]
    base_url: https://fhir.excellusbcbs.com/fhir/api
    status: known
    mvp: true
    auth:
      strategy: none
    quirks:
      page_size: 25   # Excellus caps results at 25/request
      # PractitionerRole is filter-only: rejects bare/broad/_revinclude searches
      # (all 400 — _revinclude declared but NOT honored, probed 2026-07-07). The
      # ONLY working path is chaining on a known id: PractitionerRole?practitioner=<id>.
      # Harvest by chaining every loaded Practitioner id. Bounded by practitioner
      # coverage (~25k loaded). OrganizationAffiliation has NO working chain param
      # (all 400) -> genuinely unretrievable, left at 0 (documented).
      adaptive:
        PractitionerRole: {mode: id_chain, chain_param: practitioner, source_table: practitioner}

