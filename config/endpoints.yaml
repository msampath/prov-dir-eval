  - key: regence
    payer_name: Regence (BCBS OR/WA/UT/ID; Cambia)
    parent_org: Cambia Health Solutions
    brands: [Regence BlueCross BlueShield, Asuris, BridgeSpan]
    base_url: https://api-gateway.healthsparq.com/provider-fhir-service/v1/fhir
    status: known
    mvp: false
    # Token via the SHARED hsprov host with Regence codes (verified: 330k orgs).
    # Brand variants (Asuris/BridgeSpan/Cambia) reachable via different brandCodes
    # — not yet added (need their codes; may overlap this RG set).
    auth:
      strategy: healthsparq_public_token
      token_url: https://hsprov.healthsparq.com/api/healthsparq-public-login-service/v1/token
      params: {insurer_code: RG_I, brand_code: RG, product_code: RG}
    quirks:
      next_link_replace: ["/v1/fhir/", "https://api-gateway.healthsparq.com/provider-fhir-service/v1/fhir/"]
      # Regence is HUGE (~18M) and its search params don't support prefix
      # partitioning (family is EXACT match, _lastUpdated=0, address-state=400).
      # Strategy = REFERENCE-GRAPH HARVEST (validated 2026-07-08):
      #  * PractitionerRole via the specialty ValueSet (671 codes, required
      #    binding -> exhaustive), small buckets that page fully.
      #  * Practitioner/Location/HealthcareService have NO search partition, but
      #    the /{Type}/{id} READ endpoint works and isn't paginated -> harvest
      #    their ids from references we already hold and read each by id.
      # Run order: roles first, then the id_read resources (they source from roles/
      # orgaff/hcs). Re-run id_read to closure.
      max_concurrency: 6
      adaptive:
        # `provdir harvest` uses this: sweep roles by specialty WITH _include to
        # harvest roles + practitioners + locations + orgs + services in one pass.
        PractitionerRole:
          mode: values
          param: specialty
          values_ref: specialties
          bucket_max: 100000
          include: [PractitionerRole:practitioner, PractitionerRole:location, PractitionerRole:organization, PractitionerRole:service, PractitionerRole:network]
        # id_read fallbacks (via `provdir etl`) for orphans not reached by roles.
        Practitioner:
          mode: id_read
          ref_sources: [[practitioner_role, practitioner_ref]]
        Location:
          mode: id_read
          ref_sources: [[practitioner_role, location_refs], [organization_affiliation, location_refs], [healthcare_service, location_refs], [insurance_plan, coverage_area_refs]]
        HealthcareService:
          mode: id_read
          ref_sources: [[practitioner_role, healthcare_service_refs], [organization_affiliation, healthcare_service_refs]]

