  - key: premera
    payer_name: Premera Blue Cross
    parent_org: Premera (via Opala)
    brands: [Premera Blue Cross]
    base_url: https://opala.tech/provdir/premera/v1/fhir-r4
    status: known
    mvp: true
    auth:
      strategy: none
    quirks:
      # ~50k practitioners paginated via opaque ?q= tokens; _count=1000 pages
      # are slow to generate and time out. Smaller pages are faster/stabler.
      page_size: 250
      # Bundle.link[next] dead-ends (page 2 empty), and large pages time out — but
      # SMALL filtered buckets return their full set on page 1, fast (proven:
      # family=aa -> 20 rows in 4.8s; family=smith=290 -> timeout). So adaptively
      # subdivide name-bearing resources to <=50/bucket and take page 1 only.
      # (PractitionerRole/OrganizationAffiliation lack a prefix param -> not reachable.)
      adaptive:
        Practitioner: {param: family, mode: prefix, bucket_max: 50, page1_only: true}
        Organization: {param: name, mode: prefix, bucket_max: 50, page1_only: true}
        Location: {param: name, mode: prefix, bucket_max: 50, page1_only: true}
        HealthcareService: {param: name, mode: prefix, bucket_max: 50, page1_only: true}

  - key: banner
    payer_name: Banner Health
    parent_org: Banner Health (payvider, via Innovaccer)
    brands: [Banner Health]
    base_url: https://bannerhealth-live.innovaccer.com/fhir/davinci_pdex_plan_net
    status: known
    mvp: true
    auth:
      strategy: none
    quirks:
      # Live test (2026-06-14): Innovaccer gateway does not register /metadata
      # (returns 403 {"msg":"Route Not Registered"}); Practitioner?_count=1 -> 200.
      # Liveness is confirmed by probing a resource instead of /metadata.
      no_metadata: true
      page_size: 1000
      # Bundle.link[next] points at an auth-gated /fhirwrapper/ path (401);
      # rewriting it back to /fhir/ restores public pagination.
      next_link_replace: ["/fhirwrapper/", "/fhir/"]

  - key: mvphealthcare
    payer_name: MVP Health Care
    parent_org: MVP Health Care
    brands: [MVP Health Care]
    base_url: https://api.mvphealthcare.com/provdirfhirapi
    status: known
    mvp: false   # open + validated 2026-07-06; promote to a pull subset deliberately
    auth:
      strategy: none
    quirks:
      # InterSystems HealthShare (<HSFHIRErr> errors), Azure-fronted. Deep probe
      # 2026-07-06 (docs/evidence/mvphealthcare_probe.md): open Plan-Net server,
      # 8/8 resources; unfiltered search on big resources -> 413 "SearchTooCostly"
      # (>50,000 results); queryId pagination WORKS (cursor advances); first page
      # materializes the whole selection so BIG buckets time out -> keep partition
      # buckets small. _lastUpdated counts time out -> daterange not usable.
      adaptive:
        Practitioner: {param: family, mode: prefix, bucket_max: 5000}
        Organization: {param: name, mode: prefix, bucket_max: 5000}
        Location: {param: name, mode: prefix, bucket_max: 5000}
        # Bare PractitionerRole search times out (SearchTooCostly), but the
        # reference query works: id_chain on our loaded practitioner ids. Comma-OR
        # verified 2026-07-09 (id0,id1 -> 3 = 2+1); batch 50 returns ~85 roles in
        # one page, no timeout. ~200k practitioners x ~1.7 roles ~= 340k roles.
        PractitionerRole: {mode: id_chain, chain_param: practitioner, source_table: practitioner, chain_batch: 50, chain_count: 100, chain_concurrency: 3}

  - key: healthpartners
    payer_name: HealthPartners
    parent_org: HealthPartners
    brands: [HealthPartners]
    base_url: https://api-developerportal.healthpartners.com/interop/external/fhir
    status: known
    mvp: false
    auth:
      strategy: oauth2_client_credentials
      # Token URL pending from the developer portal. It is a GATEWAY OAuth
      # provider (IBM API Connect app creds), NOT login.microsoftonline.com —
      # AAD rejects these creds with AADSTS700016 (probe 2026-07-06, see
      # docs/evidence/healthpartners_auth_probe.md). Data routes will likely
      # also need X-IBM-Client-Id alongside the Bearer.
      token_url: null
      secret_keys: [HEALTHPARTNERS_CLIENT_ID, HEALTHPARTNERS_CLIENT_SECRET]
    quirks:
      # Plan is rate-limited to 100 requests/hour (dev tier 2026-07-06; prod
      # upgrade requested). 37s spacing, single-file => ~97/h incl. retries.
      min_request_interval: 37.0
      max_concurrency: 1

