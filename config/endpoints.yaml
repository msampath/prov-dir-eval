      strategy: none
    quirks:
      # See docs/evidence/hap_pagination_and_quota.md. Two findings:
      # 1) next link -> 403ing host fhir-prov-dir-r4.api.hap.org (Banner-style);
      #    the rewrite below fixes it (proven: cursor advances on public host).
      # 2) WINDOWED REQUEST QUOTA (not a rate cap): sustained pulls 429 mid-stream;
      #    ~5 pulls + probes in 20min depleted it. Config below is correct; the
      #    remaining blocker is the depleted quota. REVISIT after >=1h with ONE
      #    slow single-resource-at-a-time pass; do not hammer with full re-pulls.
      # Burst limit confirmed (2026-07-07): spaced single requests 200, but ~5
      # requests in ~2.5s (0.5s spacing) trip 429. NOT a daily quota. 5s spacing
      # (~12/min) stays under it; slow but completes. Small directory (~360k).
      max_concurrency: 1
      min_request_interval: 5.0
      next_link_replace: ["fhir-prov-dir-r4.api.hap.org", "provider-directory-r4.api.hap.org"]

  - key: amerihealth_ncex
    payer_name: AmeriHealth Caritas (NCEX plan)
    parent_org: AmeriHealth Caritas
    brands: [AmeriHealth Caritas]
    # Multi-plan gateway: api-ext.amerihealthcaritas.com/{plan}/provider-api
    # (confirmed plans NCEX, 1200). One entry per plan; NCEX is representative.
    base_url: https://api-ext.amerihealthcaritas.com/NCEX/provider-api
    status: known
    mvp: false
    auth:
      strategy: none
    quirks:
      # HUGE directory (probe 2026-07-06): bare Practitioner 5.71M / Org 2.18M;
      # active=true 3.72M; _lastUpdated>=2026 = Pract 1.02M / Org 99,770. User
      # (2026-07-06): scope AmeriHealth to 2026 to bound volume. NOTE: this is a
      # per-payer exception to the "active flag" scope — cross-payer comparisons
      # against AmeriHealth carry a 2026-only asterisk. base_params scopes both
      # searches and the coverage count (honest %).
      base_params: {_lastUpdated: "ge2026-01-01"}
      # Even 2026-scoped, bare Practitioner caps ~654k of 1.02M and Location bare
      # times out (794k). Partition (base_params 2026 merges into each bucket +
      # its count, so coverage stays honest). Org/roles/etc. complete bare.
      adaptive:
        Practitioner: {param: family, mode: prefix, bucket_max: 100000}
        Location: {param: address-state, mode: values, bucket_max: 100000}

