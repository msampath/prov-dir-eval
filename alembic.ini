# Alembic configuration for prov-dir-eval.
# The database URL is injected at runtime from .env (see migrations/env.py),
# so the value here is only a non-secret placeholder.
[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# Overridden by env.py from Settings; never put real credentials here.
sqlalchemy.url = postgresql+psycopg://provdir:CHANGEME@localhost:5432/provdir

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
